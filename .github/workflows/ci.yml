name: CI Build InvertMouse Driver

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]
        platform: [x64, ARM64]
    runs-on: windows-2022
    env:
      Solution_Path: src\InvertMouseDriver\InvertMouseDriver.sln

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    - name: Build solution
      run: |
        msbuild ${{ env.Solution_Path }} /p:Configuration=${{ env.Configuration }} /p:Platform=${{ env.Platform }}
      env:
        Configuration: ${{ matrix.configuration }}
        Platform: ${{ matrix.platform }}

    - name: Verify and stage package
      shell: pwsh
      run: |
        $buildDir = "src\InvertMouseDriver\${{ matrix.platform }}\${{ matrix.configuration }}\InvertMouse"
        $stageDir = "artifacts\${{ matrix.platform }}"
        .\scripts\stage-driver-package.ps1 -BuildDir $buildDir -Architecture ${{ matrix.platform }} -OutputDir $stageDir

    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: InvertMouse-${{ matrix.platform }}
        path: |
          artifacts/${{ matrix.platform }}/InvertMouse.sys
          artifacts/${{ matrix.platform }}/InvertMouse.inf
          artifacts/${{ matrix.platform }}/InvertMouse.pdb
          artifacts/${{ matrix.platform }}/InvertMouseDriver_${{ matrix.platform }}.cab
        if-no-files-found: error
